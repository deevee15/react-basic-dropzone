name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        working-directory: core
        run: npm ci

      - name: Run tests
        working-directory: core
        run: npm test

      - name: Build
        working-directory: core
        run: npm run build

      - name: Check dist output
        working-directory: core
        run: |
          test -f dist/index.es.js || (echo "❌ Missing ES module" && exit 1)
          test -f dist/index.cjs.js || (echo "❌ Missing CJS module" && exit 1)
          test -f dist/index.d.ts || (echo "❌ Missing type definitions" && exit 1)
          echo "✅ All dist files present"